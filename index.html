<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perry's Video Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0f3fa8; --blue-d:#0a2a73; --blue-x:#071c4f; --yellow:#ffd21f; --yellow-d:#e0b400;
  --paper:#fbf7ec; --ink:#161616; --shelf:#1c1a17; --shelf-2:#2a2724; --wood:#5a3d1e;
  --card:#f4efe2; --muted:#7c7466; --line:#d8d0be; --ok:#1f8f4e; --red:#d8322b;
  --font-d:'Anton',Impact,'Arial Narrow',sans-serif; --font-b:'Barlow',system-ui,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--shelf);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- awning header ---------- */
.awning{background:var(--blue);color:#fff;position:relative;overflow:hidden}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 28px,var(--blue-d) 28px 56px)}
.awning-in{max-width:1180px;margin:0 auto;padding:22px 20px 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ticket{background:var(--yellow);color:var(--blue-d);font-family:var(--font-d);font-size:clamp(34px,6vw,64px);line-height:.9;
  padding:14px 26px 12px;letter-spacing:.5px;text-transform:uppercase;transform:rotate(-2deg);
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);position:relative;box-shadow:4px 5px 0 var(--blue-x)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--blue);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket small{display:block;font-size:.34em;letter-spacing:4px;margin-bottom:6px}
.tag{font-family:var(--font-d);font-size:clamp(16px,2.2vw,22px);letter-spacing:2px;text-transform:uppercase;color:var(--yellow);line-height:1.15}
.tag span{display:block;color:#fff;font-family:var(--font-b);font-weight:500;letter-spacing:0;text-transform:none;font-size:14px;opacity:.85;margin-top:4px}
.hours{margin-left:auto;background:#fff;color:var(--ink);padding:10px 14px;border:3px solid var(--yellow);font-size:13px;line-height:1.3;min-width:180px}
.hours b{font-family:var(--font-d);font-size:20px;letter-spacing:1px;color:var(--red);display:block}
.hours .n{font-family:var(--font-d);font-size:30px;color:var(--blue);line-height:1}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:4px solid var(--blue)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:2px solid var(--ink);background:#fff;border-radius:0;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.4}
.sel{padding:10px 12px;border:2px solid var(--ink);background:#fff;border-radius:0;min-width:120px;font-weight:500}
.views{display:flex;border:2px solid var(--ink);background:#fff}
.views button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;font-size:13px;font-family:var(--font-d);font-weight:400;font-size:15px;letter-spacing:1px}
.views button+button{border-left:2px solid var(--ink)}
.views button.on{background:var(--blue);color:var(--yellow)}
.pick{border:0;background:var(--red);color:#fff;font-family:var(--font-d);letter-spacing:1px;padding:10px 16px;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.pick:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chips{max-width:1180px;margin:0 auto;padding:0 20px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:2px solid var(--ink);background:#fff;padding:5px 11px;font-size:13px;font-weight:600;border-radius:999px;color:var(--ink)}
.chip.on{background:var(--yellow);border-color:var(--ink)}
.chip.grp{border:0;background:transparent;font-weight:700;font-size:12px;color:var(--muted);padding:5px 2px 5px 0;cursor:default}
.chips .clear{margin-left:auto;background:transparent;border:0;text-decoration:underline;font-weight:600;color:var(--blue)}

/* ---------- content ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 60px}
.count{color:var(--paper);font-family:var(--font-d);letter-spacing:1px;font-size:18px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.count small{font-family:var(--font-b);font-size:13px;color:#b8b0a0;letter-spacing:0}

/* grid of cases on shelves */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px;padding:0 0 18px;position:relative}
.case{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--blue-x);text-align:left;padding:0;display:flex;flex-direction:column;min-height:196px;position:relative;transition:transform .12s}
.case:hover{transform:translateY(-3px)}
.case .top{background:var(--blue);color:var(--yellow);font-family:var(--font-d);font-size:15px;line-height:1.1;padding:9px 10px 8px;letter-spacing:.3px;min-height:52px;display:flex;align-items:flex-end;word-break:break-word}
.case .body{padding:8px 10px 10px;font-size:12.5px;color:#3a3630;flex:1;display:flex;flex-direction:column;gap:4px}
.case .yr{font-weight:700;color:var(--ink)}
.case .act{color:var(--muted);line-height:1.3}
.case .foot{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border:1.5px solid var(--ink);background:#fff;text-transform:uppercase;letter-spacing:.4px}
.badge.blu{background:#1e5cc8;color:#fff;border-color:#1e5cc8}
.badge.hd{background:#8b1e1e;color:#fff;border-color:#8b1e1e}
.badge.ps3{background:#111;color:#fff;border-color:#111}
.badge.copies{background:var(--yellow)}
.badge.chk{background:var(--red);color:#fff;border-color:var(--red)}
.case.want{background:#e6e2d8;border-style:dashed;box-shadow:none;opacity:.8}
.case.want .top{background:#6b6b6b;color:#fff}
.badge.want{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.sbox li.want{color:var(--muted);font-style:italic}
.case .seen{position:absolute;top:-8px;right:-8px;background:var(--ok);color:#fff;border:2px solid #fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.case .stars{color:var(--yellow-d);font-size:13px;letter-spacing:1px;text-shadow:0 0 1px #000}

/* table */
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--blue);color:#fff;font-family:var(--font-d);font-weight:400;letter-spacing:1px;font-size:14px;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
th.s::after{content:" ▾";color:var(--yellow)} th.s.asc::after{content:" ▴"}
tr:hover td{background:#fff}
td.t{font-weight:600;cursor:pointer;color:var(--blue)}
.tw{overflow-x:auto;border:2px solid var(--ink);max-height:75vh;overflow-y:auto}

/* series */
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sbox{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--blue-x)}
.sbox h3{margin:0 0 6px;font-family:var(--font-d);font-weight:400;font-size:20px;color:var(--blue);letter-spacing:.5px}
.sbox ul{margin:0;padding:0;list-style:none;font-size:13.5px}
.sbox li{padding:3px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.sbox li:hover{color:var(--blue)}
.sbox li span{color:var(--muted);white-space:nowrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stat{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--blue-x)}
.stat h3{margin:0 0 10px;font-family:var(--font-d);font-weight:400;font-size:20px;color:var(--blue);letter-spacing:.5px}
.big{font-family:var(--font-d);font-size:54px;line-height:1;color:var(--red)}
.big small{display:block;font-family:var(--font-b);font-size:13px;color:var(--muted);margin-top:4px}
.barrow{display:grid;grid-template-columns:140px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.barrow i{display:block;height:14px;background:var(--blue);min-width:2px}
.barrow b{text-align:right;font-weight:600}
.barrow.clk{cursor:pointer}.barrow.clk:hover span{color:var(--blue);text-decoration:underline}

/* modal */
.ov{position:fixed;inset:0;background:rgba(7,28,79,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.open{display:flex}
.md{background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--yellow);max-width:640px;width:100%;max-height:92vh;overflow:auto;position:relative}
.md .hd{background:var(--blue);color:var(--yellow);padding:18px 22px 14px;font-family:var(--font-d);font-size:30px;line-height:1.05;letter-spacing:.5px;padding-right:56px}
.md .hd small{display:block;color:#fff;font-family:var(--font-b);font-size:14px;letter-spacing:0;margin-top:6px;font-weight:500}
.md .x{position:absolute;top:10px;right:10px;background:var(--yellow);border:2px solid var(--ink);width:34px;height:34px;font-weight:700;font-size:18px;line-height:1}
.md .bd{padding:18px 22px 22px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin-bottom:16px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.kv a{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline}
.mine{border-top:3px solid var(--blue);padding-top:14px}
.mine h4{margin:0 0 10px;font-family:var(--font-d);font-weight:400;font-size:18px;letter-spacing:1px;color:var(--blue)}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mrow label{font-weight:600;min-width:90px}
.tog{border:2px solid var(--ink);background:#fff;padding:7px 14px;font-weight:700}
.tog.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.star{background:transparent;border:0;font-size:28px;color:#c9c1ae;padding:0 2px;line-height:1}
.star.on{color:var(--yellow-d);text-shadow:0 0 1px #000}
.mine input[type=text],.mine textarea{width:100%;border:2px solid var(--ink);padding:8px 10px;background:#fff;font-size:14px;font-family:inherit}
.mine textarea{min-height:64px;resize:vertical}
.warn{background:#fff3c4;border:2px dashed var(--yellow-d);padding:8px 10px;font-size:13px;margin-bottom:12px}
.foot-note{max-width:1180px;margin:0 auto;padding:10px 20px 30px;color:#9a9284;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot-note button{background:transparent;border:1.5px solid #9a9284;color:#d8d0be;padding:5px 10px;font-size:12px}
.empty{background:var(--paper);border:2px dashed var(--yellow);padding:30px;text-align:center;font-family:var(--font-d);font-size:22px;color:var(--blue);letter-spacing:1px}
.empty small{display:block;font-family:var(--font-b);font-size:14px;color:var(--muted);letter-spacing:0;margin-top:6px}
.fbtn{display:none;border:2px solid var(--ink);background:#fff;padding:9px 12px;font-weight:700}
.fbtn.on{background:var(--yellow)}
@media (max-width:640px){
  .fbtn{display:inline-block}.chips{display:none}.chips.open{display:flex}.views button{padding:9px 10px;font-size:14px}
  .awning-in{gap:14px;padding:16px 14px 26px}.hours{display:none}
  .bar-in,.chips,.wrap{padding-left:12px;padding-right:12px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px 8px}
  .kv{grid-template-columns:90px 1fr}
  .md .hd{font-size:24px}
}
</style>
</head>
<body>
<header class="awning">
  <div class="awning-in">
    <div class="ticket"><small>Admit one</small>Perry's<br>Video Store</div>
    <div class="tag">Be kind. Rewind.<span>Every disc on the shelf, searchable.</span></div>
    <div class="hours"><b>Now renting</b><span class="n" id="hdr-n">—</span> titles · <span id="hdr-d">—</span> discs</div>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search titles, actors, directors…" autocomplete="off"></div>
    <select id="sort" class="sel" aria-label="Sort">
      <option value="title">A → Z</option><option value="title-d">Z → A</option>
      <option value="year-d">Newest first</option><option value="year">Oldest first</option>
      <option value="rating-d">My rating</option><option value="copies-d">Most copies</option>
    </select>
    <div class="views" role="tablist">
      <button class="on" data-v="grid">Shelf</button><button data-v="table">List</button><button data-v="series">Series</button><button data-v="stats">Stats</button>
    </div>
    <button class="fbtn" id="fbtn" aria-expanded="false">Filters</button>
    <button class="pick" id="pick" title="Random pick from the current filter">Staff pick</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<main class="wrap">
  <div class="count"><span id="count"></span><small id="hint"></small></div>
  <div id="out"></div>
</main>

<div class="foot-note">
  <span>Watched, ratings and notes are saved in this browser only.</span>
  <button id="exp">Export my data</button>
  <button id="imp">Import</button><input type="file" id="impf" accept="application/json" hidden>
  <button id="wipe">Reset my data</button>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true">
  <div class="md" id="md"></div>
</div>

,"genres":["Action","Thriller"],"actors":["Sean Connery","Alec Baldwin","Scott Glenn"],"director":"John McTiernan","series":"Jack Ryan","photo":[],"note":"","check":false,"want":true},{"id":1086,"title":"Patriot Games","year":1992,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Thriller"],"actors":["Harrison Ford","Sean Bean","Anne Archer"],"director":"Phillip Noyce","series":"Jack Ryan","photo":[],"note":"","check":false,"want":true},{"id":1087,"title":"Clear and Present Danger","year":1994,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Thriller"],"actors":["Harrison Ford","Willem Dafoe","Anne Archer"],"director":"Phillip Noyce","series":"Jack Ryan","photo":[],"note":"","check":false,"want":true},{"id":1088,"title":"The Sum of All Fears","year":2002,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Thriller"],"actors":["Ben Affleck","Morgan Freeman","James Cromwell"],"director":"Phil Alden Robinson","series":"Jack Ryan","photo":[],"note":"","check":false,"want":true},{"id":1089,"title":"RoboCop 2","year":1990,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Crime","Sci-Fi"],"actors":["Peter Weller","Nancy Allen","Dan O'Herlihy"],"director":"Irvin Kershner","series":"RoboCop","photo":[],"note":"","check":false,"want":true},{"id":1090,"title":"RoboCop 3","year":1993,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Crime","Sci-Fi"],"actors":["Robert John Burke","Nancy Allen","Rip Torn"],"director":"Fred Dekker","series":"RoboCop","photo":[],"note":"","check":false,"want":true},{"id":1091,"title":"Underworld: Rise of the Lycans","year":2009,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Fantasy","Horror"],"actors":["Michael Sheen","Bill Nighy","Rhona Mitra"],"director":"Patrick Tatopoulos","series":"Underworld","photo":[],"note":"","check":false,"want":true},{"id":1092,"title":"Underworld: Blood Wars","year":2016,"type":"Movie","format":"DVD","copies":1,"genres":["Action","Fantasy","Horror"],"a <script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const LS = 'perrys-video-store-v1';
let mine = {}; try { mine = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch(e){ mine = {}; }
function save(){ try { localStorage.setItem(LS, JSON.stringify(mine)); } catch(e){} }
function my(id){ return mine[id] || {}; }
function setMy(id, patch){ mine[id] = Object.assign({}, my(id), patch); save(); }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decade = y => y ? (Math.floor(y/10)*10) + 's' : 'Unknown';

// ----- filter state -----
const state = { q:'', sort:'title', view:'grid', type:new Set(), format:new Set(), genre:new Set(), decade:new Set(), watched:'', check:false, want:false, series:'' };
const TYPES = ['Movie','TV','Stand-up','Music','Sports','Documentary','Game'];
const FORMATS = ['DVD','Blu-ray','HD DVD','PS3'];
const genreCount = {}; DATA.forEach(r => r.genres.forEach(g => genreCount[g]=(genreCount[g]||0)+1));
const GENRES = Object.keys(genreCount).sort((a,b)=>genreCount[b]-genreCount[a]).slice(0,18);
const DECADES = [...new Set(DATA.map(r=>decade(r.year)))].filter(d=>d!=='Unknown').sort();

function renderChips(){
  const c = $('#chips'); let h = '';
  const grp = (label, key, list) => { h += `<span class="chip grp">${label}</span>`; list.forEach(v => h += `<button class="chip ${state[key].has(v)?'on':''}" data-k="${key}" data-v="${esc(v)}">${esc(v)}</button>`); };
  grp('Type', 'type', TYPES); grp('Format', 'format', FORMATS); grp('Genre', 'genre', GENRES); grp('Decade', 'decade', DECADES);
  h += `<span class="chip grp">Mine</span>
        <button class="chip ${state.watched==='y'?'on':''}" data-k="watched" data-v="y">Watched</button>
        <button class="chip ${state.watched==='n'?'on':''}" data-k="watched" data-v="n">Unwatched</button>
        <button class="chip ${state.check?'on':''}" data-k="check" data-v="1">Needs check</button>
        <button class="chip ${state.want?'on':''}" data-k="want" data-v="1">Wishlist</button>`;
  if (state.series) h += `<button class="chip on" data-k="series" data-v="">Series: ${esc(state.series)} ✕</button>`;
  h += `<button class="clear" id="clear">Clear filters</button>`;
  c.innerHTML = h;
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'clear') { ['type','format','genre','decade'].forEach(k=>state[k].clear()); state.watched=''; state.check=false; state.want=false; state.series=''; state.q=''; $('#q').value=''; }
  else { const k = b.dataset.k, v = b.dataset.v;
    if (k === 'watched') state.watched = state.watched===v ? '' : v;
    else if (k === 'check') state.check = !state.check;
    else if (k === 'want') state.want = !state.want;
    else if (k === 'series') state.series = '';
    else state[k].has(v) ? state[k].delete(v) : state[k].add(v); }
  renderChips(); render();
});

function filtered(){
  const q = state.q.trim().toLowerCase();
  let rows = DATA.filter(r => {
    if (state.type.size && !state.type.has(r.type)) return false;
    if (state.format.size && !state.format.has(r.format)) return false;
    if (state.genre.size && !r.genres.some(g => state.genre.has(g))) return false;
    if (state.decade.size && !state.decade.has(decade(r.year))) return false;
    if (state.watched==='y' && !my(r.id).watched) return false;
    if (state.watched==='n' && my(r.id).watched) return false;
    if (state.check && !r.check) return false;
    if (state.want ? !r.want : (r.want && state.view!=='series')) return false;
    if (state.series && r.series !== state.series) return false;
    if (q) { const hay = (r.title+' '+r.actors.join(' ')+' '+r.director+' '+r.series+' '+r.genres.join(' ')+' '+(r.year||'')+' '+(my(r.id).notes||'')+' '+(my(r.id).lent||'')).toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  const s = state.sort, d = s.endsWith('-d'), key = s.replace('-d','');
  rows.sort((a,b)=>{
    let va, vb;
    if (key==='title'){ va=a.title.replace(/^(the|a|an) /i,'').toLowerCase(); vb=b.title.replace(/^(the|a|an) /i,'').toLowerCase(); return d? vb.localeCompare(va): va.localeCompare(vb); }
    if (key==='year'){ va=a.year||0; vb=b.year||0; }
    if (key==='rating'){ va=my(a.id).rating||0; vb=my(b.id).rating||0; }
    if (key==='copies'){ va=a.copies; vb=b.copies; }
    return d ? (vb-va) || a.title.localeCompare(b.title) : (va-vb) || a.title.localeCompare(b.title);
  });
  return rows;
}

const fmtBadge = f => `<span class="badge ${f==='Blu-ray'?'blu':f==='HD DVD'?'hd':f==='PS3'?'ps3':''}">${esc(f)}</span>`;
const stars = n => n ? '★'.repeat(n)+'☆'.repeat(5-n) : '';

function render(){
  const rows = filtered(); const out = $('#out');
  const discs = rows.reduce((n,r)=>n+r.copies,0);
  $('#count').textContent = `${rows.length} title${rows.length===1?'':'s'} · ${discs} disc${discs===1?'':'s'}`;
  $('#hint').textContent = state.view==='series' ? 'Greyed titles are on the wishlist.' : state.view==='grid' ? 'Tap a case to open it.' : state.view==='table' ? 'Click a heading to sort.' : '';
  if (!rows.length){ out.innerHTML = `<div class="empty">Nothing on this shelf<small>Try clearing a filter or checking the spelling.</small></div>`; return; }
  if (state.view==='grid') out.innerHTML = `<div class="shelf">` + rows.map(r => {
    const m = my(r.id);
    return `<button class="case ${r.want?'want':''}" data-id="${r.id}">
      ${m.watched?`<span class="seen" title="Watched">✓</span>`:''}
      <span class="top">${esc(r.title)}</span>
      <span class="body">
        <span class="yr">${r.year||''}${r.director?` · <span style="font-weight:500">${esc(r.director.split(';')[0])}</span>`:''}</span>
        <span class="act">${esc(r.actors.slice(0,3).join(', '))}</span>
        ${m.rating?`<span class="stars">${stars(m.rating)}</span>`:''}
        <span class="foot">${fmtBadge(r.format)}${r.type!=='Movie'?`<span class="badge">${esc(r.type)}</span>`:''}${r.copies>1?`<span class="badge copies">×${r.copies}</span>`:''}${r.check?`<span class="badge chk">check</span>`:''}${r.want?`<span class="badge want">wanted</span>`:''}</span>
      </span></button>`; }).join('') + `</div>`;
  else if (state.view==='table') out.innerHTML = `<div class="tw"><table><thead><tr>
      <th data-s="title" class="s ${state.sort.startsWith('title')?(state.sort==='title'?'asc':''):''}">Title</th><th data-s="year" class="s">Year</th><th>Type</th><th>Format</th><th>Genres</th><th>Actors</th><th>Director</th><th>Series</th><th>Copies</th><th>Mine</th>
      </tr></thead><tbody>` + rows.map(r => { const m = my(r.id); return `<tr>
      <td class="t" data-id="${r.id}">${esc(r.title)}${r.check?' <span class="badge chk">check</span>':''}${r.want?' <span class="badge want">wanted</span>':''}</td><td>${r.year||''}</td><td>${esc(r.type)}</td><td>${fmtBadge(r.format)}</td>
      <td>${esc(r.genres.join(', '))}</td><td>${esc(r.actors.join(', '))}</td><td>${esc(r.director.replace(/;/g,', '))}</td><td>${esc(r.series)}</td><td>${r.copies}</td>
      <td>${m.watched?'✓ ':''}<span class="stars" style="color:#c9a300">${stars(m.rating)}</span>${m.lent?` <em>lent to ${esc(m.lent)}</em>`:''}</td></tr>`; }).join('') + `</tbody></table></div>`;
  else if (state.view==='series') {
    const groups = {}; rows.forEach(r => { if (r.series) (groups[r.series] = groups[r.series] || []).push(r); });
    const names = Object.keys(groups).filter(k=>groups[k].length>1 || rows.length<50).sort();
    out.innerHTML = names.length ? `<div class="series">` + names.map(n => `<div class="sbox"><h3>${esc(n)}</h3><ul>` +
      groups[n].sort((a,b)=>(a.year||0)-(b.year||0)).map(r => `<li class="${r.want?'want':''}" data-id="${r.id}">${esc(r.title)}${r.want?' (wanted)':''}${my(r.id).watched?' ✓':''}<span>${r.year||''}</span></li>`).join('') + `</ul></div>`).join('') + `</div>`
      : `<div class="empty">No series in this selection<small>Series view groups franchises and box sets. Clear filters to see all of them.</small></div>`;
  }
  else if (state.view==='stats') renderStats(rows);
}

function renderStats(rows){
  const cnt = (fn) => { const o={}; rows.forEach(r => fn(r).forEach(k => { if(k) o[k]=(o[k]||0)+1; })); return Object.entries(o).sort((a,b)=>b[1]-a[1]); };
  const bars = (list, n, key) => { const max = list[0]?.[1]||1; return list.slice(0,n).map(([k,v]) => `<div class="barrow ${key?'clk':''}" ${key?`data-k="${key}" data-v="${esc(k)}"`:''}><span>${esc(k)}</span><i style="width:${Math.max(2,v/max*100)}%"></i><b>${v}</b></div>`).join(''); };
  const discs = rows.reduce((n,r)=>n+r.copies,0), watched = rows.filter(r=>my(r.id).watched).length;
  const rated = rows.filter(r=>my(r.id).rating); const avg = rated.length ? (rated.reduce((n,r)=>n+my(r.id).rating,0)/rated.length).toFixed(1) : '—';
  const dups = rows.filter(r=>r.copies>1).length;
  $('#out').innerHTML = `<div class="stats">
    <div class="stat"><h3>The shelf</h3><div class="big">${rows.length}<small>titles</small></div><div class="big" style="font-size:34px;margin-top:8px">${discs}<small>discs</small></div><p style="font-size:13px;color:var(--muted);margin:10px 0 0">${dups} titles owned more than once · ${rows.filter(r=>r.check).length} still need a check</p></div>
    <div class="stat"><h3>Watched</h3><div class="big">${watched}<small>of ${rows.length} watched</small></div><div class="big" style="font-size:34px;margin-top:8px">${avg}<small>average of ${rated.length} rated</small></div></div>
    <div class="stat"><h3>By type</h3>${bars(cnt(r=>[r.type]),8,'type')}</div>
    <div class="stat"><h3>By format</h3>${bars(cnt(r=>[r.format]),5,'format')}</div>
    <div class="stat"><h3>Top actors</h3>${bars(cnt(r=>r.actors),12)}</div>
    <div class="stat"><h3>Top directors</h3>${bars(cnt(r=>r.director.split(';')),10)}</div>
    <div class="stat"><h3>By genre</h3>${bars(cnt(r=>r.genres),12,'genre')}</div>
    <div class="stat"><h3>By decade</h3>${bars(cnt(r=>[decade(r.year)]).sort((a,b)=>a[0].localeCompare(b[0])),12,'decade')}</div>
    <div class="stat"><h3>Biggest series</h3>${bars(cnt(r=>[r.series]),10)}</div>
  </div>`;
}

// ----- modal -----
function openModal(id){
  const r = DATA.find(x=>x.id===id); if (!r) return; const m = my(id);
  $('#md').innerHTML = `<div class="hd">${esc(r.title)}<small>${r.year||''}${r.director?' · Directed by '+esc(r.director.replace(/;/g,', ')):''}</small></div>
    <button class="x" id="mx" aria-label="Close">✕</button>
    <div class="bd">
      ${r.want?`<div class="warn">On the wishlist — not on the shelf yet${r.note?': '+esc(r.note):''}.</div>`:''}
      ${r.check?`<div class="warn">Flagged for a check: ${esc(r.note||'title or format was hard to read on the spine')}. Fix it in the spreadsheet / data file.</div>`:''}
      <dl class="kv">
        <dt>Type</dt><dd>${esc(r.type)} · ${fmtBadge(r.format)}${r.copies>1?` · <b>${r.copies} copies</b>`:''}</dd>
        ${r.genres.length?`<dt>Genre</dt><dd>${r.genres.map(g=>`<a data-g="${esc(g)}">${esc(g)}</a>`).join(', ')}</dd>`:''}
        ${r.actors.length?`<dt>Starring</dt><dd>${r.actors.map(a=>`<a data-a="${esc(a)}">${esc(a)}</a>`).join(', ')}</dd>`:''}
        ${r.series?`<dt>Series</dt><dd><a data-s="${esc(r.series)}">${esc(r.series)}</a></dd>`:''}
        ${r.note&&!r.check?`<dt>Edition</dt><dd>${esc(r.note)}</dd>`:''}
        <dt>Shelf</dt><dd>Photo ${r.photo.join(', ')||'?'}</dd>
      </dl>
      <div class="mine"><h4>My copy</h4>
        <div class="mrow"><label>Watched</label><button class="tog ${m.watched?'on':''}" id="mw">${m.watched?'Watched ✓':'Not yet'}</button></div>
        <div class="mrow"><label>Rating</label><span id="mr">${[1,2,3,4,5].map(n=>`<button class="star ${m.rating>=n?'on':''}" data-n="${n}" aria-label="${n} stars">★</button>`).join('')}</span></div>
        <div class="mrow"><label>Lent to</label><input type="text" id="ml" value="${esc(m.lent||'')}" placeholder="Who has it right now?"></div>
        <div class="mrow" style="align-items:flex-start"><label>Notes</label><textarea id="mn" placeholder="Scratched disc 2, bought at Value Village…">${esc(m.notes||'')}</textarea></div>
      </div>
    </div>`;
  $('#ov').classList.add('open');
  $('#mx').onclick = closeModal;
  $('#mw').onclick = () => { setMy(id,{watched:!my(id).watched}); openModal(id); render(); };
  $('#mr').onclick = e => { const b = e.target.closest('.star'); if(!b) return; const n=+b.dataset.n; setMy(id,{rating: my(id).rating===n?0:n}); openModal(id); render(); };
  $('#ml').oninput = e => setMy(id,{lent:e.target.value});
  $('#mn').oninput = e => setMy(id,{notes:e.target.value});
  $('#md').querySelectorAll('.kv a').forEach(a => a.onclick = () => {
    if (a.dataset.g){ state.genre.clear(); state.genre.add(a.dataset.g); }
    if (a.dataset.a){ state.q = a.dataset.a; $('#q').value = a.dataset.a; }
    if (a.dataset.s){ state.series = a.dataset.s; }
    closeModal(); renderChips(); render(); window.scrollTo({top:0});
  });
}
function closeModal(){ $('#ov').classList.remove('open'); render(); }
$('#ov').addEventListener('click', e => { if (e.target.id==='ov') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// ----- wiring -----
$('#out').addEventListener('click', e => {
  const el = e.target.closest('[data-id]'); if (el){ openModal(+el.dataset.id); return; }
  const th = e.target.closest('th[data-s]'); if (th){ const k=th.dataset.s; state.sort = state.sort===k ? k+'-d' : k; $('#sort').value = state.sort; render(); return; }
  const br = e.target.closest('.barrow.clk'); if (br){ state[br.dataset.k].clear(); state[br.dataset.k].add(br.dataset.v); state.view='grid'; document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('on',b.dataset.v==='grid')); renderChips(); render(); window.scrollTo({top:0}); }
});
let t; $('#q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(()=>{ state.q = e.target.value; render(); }, 120); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.v; document.querySelectorAll('.views button').forEach(x=>x.classList.toggle('on',x===b)); render(); }));
$('#pick').addEventListener('click', () => { const rows = filtered(); if (rows.length) openModal(rows[Math.floor(Math.random()*rows.length)].id); });
$('#exp').addEventListener('click', () => { const a = document.createElement('a'); a.href = 'data:application/json,'+encodeURIComponent(JSON.stringify(mine,null,1)); a.download = 'perrys-video-store-mydata.json'; a.click(); });
$('#imp').addEventListener('click', () => $('#impf').click());
$('#impf').addEventListener('change', e => { const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); if (j && typeof j==='object'){ mine = Object.assign(mine, j); save(); render(); alert('Imported.'); } } catch(err){ alert('That file is not valid JSON.'); } }; rd.readAsText(f); });
$('#wipe').addEventListener('click', () => { if (confirm('Erase all watched marks, ratings, notes and lent-to entries saved in this browser?')) { mine = {}; save(); render(); } });

$('#fbtn').addEventListener('click', () => { const o = $('#chips').classList.toggle('open'); $('#fbtn').classList.toggle('on',o); $('#fbtn').setAttribute('aria-expanded',o); });
const OWN = DATA.filter(r=>!r.want);
$('#hdr-n').textContent = OWN.length.toLocaleString();
$('#hdr-d').textContent = OWN.reduce((n,r)=>n+r.copies,0).toLocaleString();
renderChips(); render();
})();
</script>
</body>
</html>
